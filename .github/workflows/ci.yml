name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: lint / typecheck / unit / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The lockfile is resolved with npm 11; stock Node 22 images ship
      # npm 10, which computes a different peer tree and fails `npm ci`.
      - run: npm install -g npm@11.17.0

      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e (postgres service)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: propora
          POSTGRES_PASSWORD: propora
          POSTGRES_DB: propora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U propora -d propora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://propora:propora@localhost:5432/propora
      JWT_ACCESS_SECRET: ci-test-secret-at-least-32-chars-long
      DEMO_ORGANIZATION: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The lockfile is resolved with npm 11; stock Node 22 images ship
      # npm 10, which computes a different peer tree and fails `npm ci`.
      - run: npm install -g npm@11.17.0

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run test:e2e
