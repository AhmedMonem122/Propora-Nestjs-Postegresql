services:
  postgres:
    image: postgres:16-alpine
    container_name: propora-postgres
    environment:
      POSTGRES_USER: propora
      POSTGRES_PASSWORD: propora
      POSTGRES_DB: propora
    ports:
      - "5432:5432"
    volumes:
      - propora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propora -d propora"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  propora_pgdata:
